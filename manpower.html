const K = 'plaud-manpower-pw';
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function open_(pw) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name: 'PBKDF2', salt: b64(BLOB.s), iterations: 200000, hash: 'SHA-256'},
                                            base, {name: 'AES-GCM', length: 256}, false, ['decrypt']);
  const html = new TextDecoder().decode(await crypto.subtle.decrypt({name: 'AES-GCM', iv: b64(BLOB.i)}, key, b64(BLOB.c)));
  try { localStorage.setItem(K, pw); } catch (e) {}
  document.open(); document.write(html); document.close();
}
document.getElementById('f').onsubmit = e => {
  e.preventDefault();
  open_(document.getElementById('pw').value).catch(() => { document.getElementById('err').textContent = '密码不对，请再试一次'; });
};
let saved = null; try { saved = localStorage.getItem(K); } catch (e) {}
if (saved) open_(saved).catch(() => { try { localStorage.removeItem(K); } catch (e) {} });
