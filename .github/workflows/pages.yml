name: 发布网页
# 2026-11-09 Mili 定：网页发布从 GitHub 老式「pages build and deployment」（每次 3 个任务，约 3 分钟计费）
# 改成这个一步发完（每次 1 个任务，约 1 分钟）。仓库里的文件原样发布，不做任何加工。
# 要在 Settings → Pages → Build and deployment → Source 选「GitHub Actions」才接手；
# 还是老办法（Deploy from a branch）的时候，这里只检查一下就结束，网页照老办法发布，不会重复发。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: 看网页设置是不是已经切到「GitHub Actions」
        id: mode
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          t=$(gh api "repos/${{ github.repository }}/pages" --jq .build_type) || { echo "::error::读不到网页设置（Pages）"; exit 1; }
          echo "build_type=$t" >> "$GITHUB_OUTPUT"
          if [ "$t" != workflow ]; then echo "::notice::网页还是老办法发布（$t），这次跳过；Settings → Pages → Source 改成 GitHub Actions 后由这里发布"; fi
      - uses: actions/checkout@v4
        if: steps.mode.outputs.build_type == 'workflow'
      - uses: actions/upload-pages-artifact@v3
        id: bundle
        if: steps.mode.outputs.build_type == 'workflow'
        with:
          path: .
      - name: 等物流看板构建包可读
        if: steps.mode.outputs.build_type == 'workflow' && startsWith(github.event.head_commit.message, 'logistics dashboard ')
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.bundle.outputs.artifact_id }}
        run: |
          set -e
          [ -n "$ARTIFACT_ID" ] || { echo '::error::没有收到上传的构建包编号'; exit 1; }
          for attempt in {1..12}; do
            ready=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
              -f name=github-pages --jq '.artifacts[] | select(.expired == false and .size_in_bytes > 0) | .id') || ready=
            if [ "$ready" = "$ARTIFACT_ID" ]; then
              # The deploy action reads the artifact index through the runner service too.
              sleep 5
              echo "构建包 $ARTIFACT_ID 已可读"
              exit 0
            fi
            sleep 5
          done
          echo '::error::构建包上传后等待超时'
          exit 1
      - id: deploy
        uses: actions/deploy-pages@v4
        if: steps.mode.outputs.build_type == 'workflow'
